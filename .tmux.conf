# Configure color
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-ghostty:RGB:sync"
set -ag terminal-overrides ",xterm-ghostty:Tc"

# Change default binding from ctrl-b to ctrl-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Reload binding
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


# Change keybindings for splitting windows
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Add keybinding to resize tmux pane
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize and minimize tmux pane
bind -r m resize-pane -Z

# Enable mouse in tmux
set -g mouse on

# OSC 52 clipboard: tmux handles OSC52 natively, allow-passthrough lets inner apps send their own
set -g set-clipboard off
set -g allow-passthrough on
set -ag terminal-overrides ",xterm*:XT:Ms=\\E]52;c;%p2%s\\7"
set -ag terminal-overrides ",screen*:XT:Ms=\\E]52;c;%p2%s\\7"
set -ag terminal-overrides ",vte*:XT:Ms=\\E]52;c;%p2%s\\7"

# Increase history size
set -g history-limit 40000

# Less lag through ssh
set -sg escape-time 0

# Forward terminal focus events into the active pane (needed by nvim for
# accurate FocusGained/FocusLost autocmds and redraw timing across pane switches)
set -g focus-events on

# Only redraw the active pane on window-level updates — reduces per-scroll
# work in nvim panes when other panes share the window.
set -g aggressive-resize on

# Vim movements for copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'yank > #{client_tty}'

# yank current buffer to terminal clipboard
bind-key -n M-y run-shell 'tmux save-buffer - | yank > #{client_tty}'
# choose a buffer and yank it to terminal clipboard
bind-key -n M-Y choose-buffer 'run-shell "tmux save-buffer -b \"%%%\" - | yank > #{client_tty}"'

unbind -T copy-mode-vi MouseDragEnd1Pane

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @themepack 'powerline/default/cyan' # use this theme for tmux

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Source - https://stackoverflow.com/a
# Posted by Dryice Liu
# Retrieved 2026-01-05, License - CC BY-SA 3.0
set-option -g set-titles on
set-option -g set-titles-string "#{session_name} - #{host}"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
